apply from: new File(rootProject.ext.repoRoot, "gradle/common-target.gradle")
apply plugin: "com.gradleup.shadow"

def vp = project.ext.vp
def mcVersion = project.ext.mcVersion
def isModern = project.ext.isModern
def repoRoot = rootProject.ext.repoRoot
def commonPath = ":common-${projectDir.parentFile.name}"
evaluationDependsOn(commonPath)
def implConfiguration = isModern ? "implementation" : "modImplementation"
def apiConfiguration = isModern ? "api" : "modApi"
def compileOnlyConfiguration = isModern ? "compileOnly" : "modCompileOnly"

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project.ext.commonAccessWidener
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven {
        name = "Terraformers"
        url = uri("https://maven.terraformersmc.com/releases/")
        content {
            includeGroupByRegex("com\\.terraformersmc(\\..*)?")
            includeGroupByRegex("remapped\\.com\\.terraformersmc(\\..*)?")
        }
    }
}

dependencies {
    add(implConfiguration, "net.fabricmc:fabric-loader:${vp.getProperty('fabric_loader_version')}")
    add(apiConfiguration, "net.fabricmc.fabric-api:fabric-api:${vp.getProperty('fabric_api_version')}")
    add(apiConfiguration, "me.shedaniel.cloth:cloth-config-fabric:${vp.getProperty('cloth_config_version')}")
    add(apiConfiguration, "com.terraformersmc:modmenu:${vp.getProperty('modmenu_version')}")
    add(compileOnlyConfiguration, "maven.modrinth:jade:${vp.getProperty('jade_version')}+fabric-fabric,${vp.getProperty('jade_minecraft_version')}")
    if (vp.getProperty("architectury_dependency") == "true") {
        add(apiConfiguration, "dev.architectury:architectury-fabric:${vp.getProperty('architectury_version')}")
    }

    common(project(path: commonPath, configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: commonPath, configuration: "transformProductionFabric")) { transitive = false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand(["version": project.version]) {
            escapeBackslash = true
        }
    }
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set(isModern ? null : "dev-shadow")
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(commonPath).sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

if (!isModern) {
    remapJar {
        injectAccessWidener = true
        inputFile.set(shadowJar.archiveFile)
        dependsOn shadowJar
        archiveClassifier.set(null)
    }
}

if (vp.getProperty("source_family") == "1.21.1") {
    dependencies {
        add(compileOnlyConfiguration, "maven.modrinth:treechop:YK5sxWxT") { transitive = false }
    }
}

def releaseTask = isModern ? "shadowJar" : "remapJar"
tasks.register("collectJar", Copy) {
    dependsOn tasks.named(releaseTask)
    from(tasks.named(releaseTask).flatMap { it.archiveFile })
    into(new File(repoRoot, "dist"))
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-fabric"
            from components.java
        }
    }
}
