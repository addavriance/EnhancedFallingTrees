apply from: new File(rootProject.ext.repoRoot, "gradle/common-target.gradle")
apply plugin: "com.gradleup.shadow"

def vp = project.ext.vp
def mcVersion = project.ext.mcVersion
def isModern = project.ext.isModern
def repoRoot = rootProject.ext.repoRoot
def commonPath = ":common-${projectDir.parentFile.name}"
evaluationDependsOn(commonPath)
def apiConfiguration = isModern ? "api" : "modApi"
def compileOnlyConfiguration = "compileOnly"

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project.ext.commonAccessWidener

    runs {
        client {
            client()
            ideConfigGenerated(true)
            runDir "run"
            name "Minecraft Client (:neoforge)"
        }
        server {
            server()
            ideConfigGenerated(true)
            runDir "run"
            name "Minecraft Server (:neoforge)"
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    if (!isModern) {
        runtimeClasspath.extendsFrom common
        developmentNeoForge.extendsFrom common
    }
}

if (isModern) {
    configurations.runtimeClasspath.exclude group: "io.github.llamalad7", module: "mixinextras-fabric"
}

dependencies {
    neoForge "net.neoforged:neoforge:${vp.getProperty('neoforge_version')}"
    add(compileOnlyConfiguration, "net.fabricmc:fabric-loader:${vp.getProperty('fabric_loader_version')}")
    add(apiConfiguration, "me.shedaniel.cloth:cloth-config-neoforge:${vp.getProperty('cloth_config_neoforge_version')}")
    if (vp.getProperty("source_family") == "1.21.1") {
        add(compileOnlyConfiguration, "maven.modrinth:treechop:iLXWmfax") { transitive = false }
    }

    common(project(path: commonPath, configuration: "namedElements")) { transitive = false }
    if (!isModern) {
        shadowCommon(project(path: commonPath, configuration: "transformProductionNeoForge")) { transitive = false }
    }
}

if (isModern) {
    def mergeCommonOutput = tasks.register("mergeCommonOutput", Copy) {
        dependsOn project(commonPath).tasks.named("classes")
        dependsOn tasks.named("compileJava"), tasks.named("processResources")
        from(project(commonPath).sourceSets.main.output)
        into(sourceSets.main.output.classesDirs.singleFile)
        exclude "architectury.common.json", "efallingtrees.accesswidener"
    }

    tasks.named("classes") {
        dependsOn mergeCommonOutput
    }
}

processResources {
    inputs.property "version", project.version

    if (isModern) {
        exclude "architectury.common.json", "efallingtrees.accesswidener"
    }

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = isModern ? [] : [project.configurations.shadowCommon]
    archiveClassifier.set(isModern ? null : "dev-shadow")
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(commonPath).sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

if (!isModern) {
    remapJar {
        inputFile.set(shadowJar.archiveFile)
        dependsOn shadowJar
        archiveClassifier.set(null)
    }
}

def releaseTask = isModern ? "shadowJar" : "remapJar"
tasks.register("collectJar", Copy) {
    dependsOn tasks.named(releaseTask)
    from(tasks.named(releaseTask).flatMap { it.archiveFile })
    into(new File(repoRoot, "dist"))
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-neoforge"
            from components.java
        }
    }
}
