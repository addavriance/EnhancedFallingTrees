dependencies {
    implementation 'org.jetbrains:annotations:24.0.0'

    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}")

    compileOnly("maven.modrinth:jade:${rootProject.jade_version}+fabric-fabric,${rootProject.jade_minecraft_version}")
}

loom {
    accessWidenerPath = file("src/main/resources/efallingtrees.accesswidener")
}

architectury {
    common("fabric", "forge", "neoforge")
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
