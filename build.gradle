plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom-no-remap" version "1.17-SNAPSHOT" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    dependencies {
        // No parchment mappings yet for 26.x - loom-no-remap uses official Mojang names directly anyway.
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }
    version = project.name == rootProject.name ?
            "${rootProject.mod_version}-${rootProject.minecraft_version}" :
            "${rootProject.mod_version}-${rootProject.minecraft_version}+${project.name}"
    group = rootProject.maven_group

    repositories {
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }

        maven { url = uri("https://maven.shedaniel.me/") }
        maven { url = uri("https://maven.neoforged.net/releases") }
        maven { url = uri("https://maven.quiltmc.org/repository/release") }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 25
    }

    java {
        withSourcesJar()
    }
}

apply from: 'gradle/telegram.gradle'
